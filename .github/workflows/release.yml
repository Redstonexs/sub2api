name: Release

on:
  push:
    tags:
      - '1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., 1.4.1)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validated_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag
        id: validated_tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_NAME="$RELEASE_TAG_INPUT"
          VERSION=${TAG_NAME#v}
          if ! [[ "$VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG_NAME"
            echo "Fork releases must use the 1.x.y version line. Upstream v0.1.x tags are ignored."
            exit 1
          fi
          printf 'tag=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: [validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [validate-release-tag, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      # 恢复缓存：默认分支 CI（backend-ci.yml 的 warm-goreleaser-cache）
      # 已用 goreleaser build --snapshot 预热专用 GOCACHE，tag 任务直接复用
      # 以加速交叉编译。仅恢复、不保存：tag 作用域的缓存写入无法被复用。
      - name: Restore GoReleaser Go build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/goreleaser-go-build
          key: goreleaser-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.goreleaser.yaml') }}

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Get tag message
        id: tag_message
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用 EOF 分隔符处理多行内容
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          install-only: true

      # GoReleaser 只重试它自己识别的瞬时错误（internal/pipe/docker/v2 的
      # IsRetriableBuild + retryx.IsNetworkError）。GHCR 触发二级速率限制时
      # buildx 输出的是 `denied: permission_denied` + HTTP 403，不在这些名单内，
      # 因此一次 push 被拒就会中断整轮 release（二进制与 GitHub Release 一并作废）。
      # 这里按输出特征识别瞬时故障并整轮重跑；非瞬时错误立即失败，不浪费构建时间。
      - name: Run GoReleaser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
          GOCACHE: ${{ runner.temp }}/goreleaser-go-build
        run: |
          # 关闭 errexit：失败要由下面的重试逻辑决定是重跑还是退出。
          set +e
          set -uo pipefail

          ARGS=(release --clean)
          if [ "${SIMPLE_RELEASE}" = "true" ]; then
            ARGS+=(--config=.goreleaser.simple.yaml)
          fi

          # 仅匹配到这些特征才重跑；编译失败、模板错误、认证失败等立即退出。
          TRANSIENT='secondary rate limit|toomanyrequests|too many requests|HTTP status code 5[0-9][0-9]|internal server error|bad gateway|service unavailable|gateway time-?out|unexpected EOF|connection reset by peer|TLS handshake timeout|i/o timeout'

          LOG="${RUNNER_TEMP}/goreleaser.log"
          MAX_ATTEMPTS=3
          DELAY=180

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "::group::GoReleaser attempt ${attempt}/${MAX_ATTEMPTS}"
            goreleaser "${ARGS[@]}" 2>&1 | tee "${LOG}"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "${status}" -eq 0 ]; then
              exit 0
            fi

            if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
              echo "::error::GoReleaser failed after ${MAX_ATTEMPTS} attempt(s) (exit ${status})"
              exit "${status}"
            fi

            if ! grep -Eiq "${TRANSIENT}" "${LOG}"; then
              echo "::error::GoReleaser failed with a non-transient error (exit ${status}); not retrying"
              exit "${status}"
            fi

            echo "::warning::Transient registry/API failure detected, retrying in ${DELAY}s"
            sleep "${DELAY}"
            DELAY=$(( DELAY * 2 ))
          done

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
          RELEASE_TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="$RELEASE_TAG"
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE="$RELEASE_TAG_MESSAGE"
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [release, validate-release-tag]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          VERSION=${TAG_NAME#v}

          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
