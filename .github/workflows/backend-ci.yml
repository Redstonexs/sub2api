name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  # Warms a dedicated GoReleaser GOCACHE on default-branch pushes only.
  # Tag jobs (release.yml) restore this exact-key cache, which cannot be
  # re-warmed at release time because tag-scoped cache writes are not reusable.
  # The key is stable so source-only pushes reuse the populated entry.
  warm-goreleaser-cache:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      # Compute the key once, before any step that can mutate go.mod/go.sum
      # (GoReleaser's before hook runs `go mod tidy -C backend`), so restore
      # and save use the identical key.
      - name: Compute GoReleaser cache key
        id: goreleaser-cache-key
        run: |
          echo "key=goreleaser-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.goreleaser.yaml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore GoReleaser Go build cache
        id: restore-goreleaser-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/goreleaser-go-build
          key: ${{ steps.goreleaser-cache-key.outputs.key }}
      - name: Create placeholder for embedded frontend
        if: steps.restore-goreleaser-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p backend/internal/web/dist
          # The placeholder makes `go:embed all:dist` compile on a clean checkout.
          # It is ignored and exists only in the runner workspace.
          touch backend/internal/web/dist/.cache-warm-placeholder
      - name: Warm GoReleaser Go build cache
        if: steps.restore-goreleaser-cache.outputs.cache-hit != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean
        env:
          GOCACHE: ${{ runner.temp }}/goreleaser-go-build
          # GoReleaser evaluates the release-section templates even for snapshot
          # builds (scm releases pipe); non-secret GitHub context, mirrors release.yml.
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
      - name: Save GoReleaser Go build cache
        if: success() && steps.restore-goreleaser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/goreleaser-go-build
          key: ${{ steps.goreleaser-cache-key.outputs.key }}
