packages:
  - .

allowBuilds:
  esbuild: true
  vue-demi: true
overrides:
  js-cookie: 3.0.7
  "form-data@<4.0.6": ">=4.0.6"
  mermaid@11.14.0: 11.16.0
  postcss: 8.5.22
  uuid@11.1.0: 11.1.1
  uuid@13.0.0: 13.0.1
  yaml@1.10.2: 1.10.3
  # Security advisories in transitive dev/build dependencies. Each override is a
  # patch bump inside the existing major so the toolchain stays on the same API.
  # Ranges (not pins) keep multiple majors resolvable and avoid downgrading a
  # path that already resolves higher.
  "minimatch@<3.1.4": ">=3.1.4 <4"
  "minimatch@>=9.0.0 <9.0.7": ">=9.0.7 <10"
  "brace-expansion@<1.1.16": ">=1.1.16 <2"
  "brace-expansion@>=2.0.0 <2.1.2": ">=2.1.2 <3"
  "picomatch@<2.3.2": ">=2.3.2 <3"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4 <5"
  "flatted@<3.4.2": ">=3.4.2 <4"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0 <5"
  "lodash@<4.17.24": ">=4.17.24"
  "ws@<8.21.0": ">=8.21.0 <9"
  "ajv@>=6.0.0 <6.14.0": ">=6.14.0 <7"
  "rollup@<4.59.0": ">=4.59.0 <5"
  "dompurify@<3.4.14": ">=3.4.14"
